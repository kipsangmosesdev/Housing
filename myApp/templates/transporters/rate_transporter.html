{% extends "myApp/base.html" %}


{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg border-0 rounded-3">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">
                <i class="fas fa-star-half-alt me-2"></i> Rate {{ transporter.full_name }}
            </h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_rating" class="form-label fw-bold">Rating</label>
                    {{ form.rating }}
                </div>
                <div class="mb-3">
                    <label for="id_comment" class="form-label fw-bold">Comment</label>
                    {{ form.comment }}
                </div>
                <button type="submit" class="btn btn-success px-4">
                    <i class="fas fa-paper-plane me-1"></i> Submit
                </button>
                <a href="{% url 'transporter_details' transporter.id %}" class="btn btn-secondary px-4">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
