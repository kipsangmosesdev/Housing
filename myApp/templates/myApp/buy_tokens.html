{% extends 'myApp/base.html' %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm" style="border-top: 3px solid #0e2a45;">
        <div class="card-header bg-white">
          <h3 class="mb-0 text-center" style="color: #0e2a45;">
            <i class="fas fa-coins me-2"></i>Purchase Tokens
          </h3>
        </div>
        
        <div class="card-body p-4">
          <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
              <label for="{{ form.token_count.id_for_label }}" class="form-label fw-medium" style="color: #0e2a45;">
                {{ form.token_count.label }}
              </label>
              {{ form.token_count }}
              <small class="text-muted">1 token = Ksh 20</small>
            </div>

            <div class="mb-4">
              <label class="form-label fw-medium" style="color: #0e2a45;">Total Amount</label>
              <div class="input-group">
                <span class="input-group-text bg-light">Ksh</span>
                <input type="text" id="total_amount" class="form-control" value="20" readonly>
              </div>
            </div>

            <div class="mb-4">
              <label for="{{ form.phone_number.id_for_label }}" class="form-label fw-medium" style="color: #0e2a45;">
                {{ form.phone_number.label }}
              </label>
              <div class="input-group">
                <span class="input-group-text bg-light">+254</span>
                {{ form.phone_number }}
              </div>
              <small class="text-muted">Payment instructions will be sent here</small>
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn py-2" style="background-color: #0e2a45; color: white;">
                <i class="fas fa-lock me-2"></i> Secure Payment
              </button>
              <a href="{% url 'tenant_dashboard' %}" class="btn btn-outline-secondary py-2">
                <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function calculateAmount() {
    const tokenInput = document.getElementById('id_token_count');
    const amountField = document.getElementById('total_amount');
    const tokens = parseInt(tokenInput.value) || 0;
    amountField.value = tokens * 20;
  }

  // Initial calculation
  calculateAmount();
  
  // Add event listener for changes
  document.getElementById('id_token_count').addEventListener('input', calculateAmount);
</script>

<style>
  .form-control, .form-select {
    height: 45px;
    border-radius: 0.375rem;
    border: 1px solid #ced4da;
  }

  .form-control:focus, .form-select:focus {
    border-color: #ffde8a;
    box-shadow: 0 0 0 0.25rem rgba(10, 117, 79, 0.15);
  }

  .input-group-text {
    background-color: #f8f9fa;
    color: #5a5a5a;
  }

  .btn-outline-secondary {
    border-color: #0e2a45;
    color: #0e2a45;
  }

  .btn-outline-secondary:hover {
    background-color: #ffde8a;
    color: #0e2a45;
  }

  .card {
    border-radius: 0.5rem;
    overflow: hidden;
  }

  @media (max-width: 768px) {
    .card-body {
      padding: 1.5rem !important;
    }
  }
</style>
{% endblock %}
