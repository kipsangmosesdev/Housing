{% extends 'myApp/base.html' %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4 w-100" style="max-width: 500px; border-radius: 15px; background-color: #f9f9f9;">
        <h2 class="text-center mb-4" style="color: #0e2a45;">Change Password</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="current_password" class="form-label fw-semibold" style="color: #0a5fa1;">Current Password</label>
                <input type="password" class="form-control" id="current_password" name="current_password" required>
            </div>
            <div class="mb-3">
                <label for="new_password" class="form-label fw-semibold" style="color: #0a5fa1;">New Password</label>
                <input type="password" class="form-control" id="new_password" name="new_password" required>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label fw-semibold" style="color: #0a5fa1;">Confirm New Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" 
                class="btn w-100 fw-bold"
                style="background-color: #c8a173; color: #0e2a45; border: none; border-radius: 8px;">
                Change Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
