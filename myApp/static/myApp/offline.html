<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e2a45">
  <title>Offline · XbomaSwift</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #1e293b; background: #f8fafc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 36px; border: 1px solid #e2e8f0; border-radius: 20px; background: #fff; box-shadow: 0 18px 48px #0e2a4518; text-align: center; }
    img { width: 68px; height: 68px; }
    h1 { margin: 18px 0 8px; color: #0e2a45; font-size: 1.55rem; }
    p { margin: 0; color: #64748b; line-height: 1.65; }
    button { margin-top: 24px; padding: 11px 18px; border: 0; border-radius: 10px; color: #fff; background: #0e2a45; font: inherit; font-weight: 650; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/static/myApp/images/pwa-icon.svg" alt="">
    <h1>You’re offline</h1>
    <p>Reconnect to the internet to continue browsing XbomaSwift. Your account and property information will load when you’re back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
